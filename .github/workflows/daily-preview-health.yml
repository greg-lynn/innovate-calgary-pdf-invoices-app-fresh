name: Daily Preview Health Check

on:
  schedule:
    - cron: "20 12 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  preview-health:
    runs-on: ubuntu-latest
    env:
      PREVIEW_HEALTH_WORKSPACE_BASE_URL: https://innovate-calgary.rocketlane.com
      PREVIEW_HEALTH_INVOICE_NUMBERS: INV-000194,INV-000164,INV-000168
      PREVIEW_HEALTH_MAX_MS: "5000"
      PREVIEW_HEALTH_ATTEMPTS_PER_INVOICE: "2"
      PREVIEW_HEALTH_REPORT_PATH: artifacts/preview-health-report.json
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Validate JavaScript syntax
        run: npm run check:js

      - name: Run preview reliability and speed health checks
        id: health
        continue-on-error: true
        run: npm run health:preview

      - name: Upload preview health report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-health-report
          path: artifacts/preview-health-report.json
          if-no-files-found: warn

      - name: Open issue on health-check failure
        if: steps.health.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const reportPath = 'artifacts/preview-health-report.json';
            let report = null;
            if (fs.existsSync(reportPath)) {
              try {
                report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
              } catch (error) {
                report = { parseError: String(error) };
              }
            }
            const dateTag = new Date().toISOString().slice(0, 10);
            const title = `[Daily Preview Health] Failure ${dateTag}`;
            const body = [
              'Daily preview health check failed.',
              '',
              '### Summary',
              '```json',
              JSON.stringify(report || { error: 'Missing preview health report' }, null, 2),
              '```',
              '',
              'This issue was auto-created by `.github/workflows/daily-preview-health.yml`.'
            ].join('\n');
            const existing = await github.paginate(
              github.rest.issues.listForRepo,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                per_page: 100
              }
            );
            const duplicate = existing.find((issue) => issue.title === title);
            if (!duplicate) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['bug']
              });
            }

      - name: Fail workflow when health check fails
        if: steps.health.outcome == 'failure'
        run: exit 1
